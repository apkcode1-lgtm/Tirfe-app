<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <title>ትርፌ - የአከፋፋይ መቆጣጠሪያ ማዕከል</title>
    <style>
        :root { --bg-color: #0b0f19; --card-bg: #151f32; --text-color: #f1f5f9; --accent-color: #38bdf8; --success-color: #4ade80; --danger-color: #f87171; --warning-color: #fbbf24; --border-color: rgba(255, 255, 255, 0.08); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }

        header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        h1 { color: var(--success-color); font-size: 1.5rem; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 10px; text-align: center; border-left: 4px solid var(--accent-color); border-top: 1px solid var(--border-color); }
        .card h3 { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 5px; }
        .card p { font-size: 1.5rem; font-weight: bold; color: var(--success-color); }

        .section-box { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border-color); overflow-x: auto; }
        .section-box h2 { font-size: 1.2rem; margin-bottom: 15px; color: var(--accent-color); border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #3a506b; background: rgba(0,0,0,0.3); color: white; outline: none; font-family: inherit; font-size: 1rem; }
        select option { background: #151f32; color: white; }
        button { padding: 10px 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-add { background: var(--accent-color); color: #000; width: 100%; margin-top: 10px; }
        .btn-settings { background: #64748b; color: #fff; }
        .btn-action { background: var(--warning-color); color: #000; font-size: 0.8rem; padding: 6px 10px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 700px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
        th { background: rgba(0,0,0,0.4); color: var(--accent-color); }

        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .status-pending { background: rgba(251, 191, 36, 0.2); color: var(--warning-color); }
        .status-shipped { background: rgba(56, 189, 248, 0.2); color: var(--accent-color); }
        .status-delivered { background: rgba(74, 222, 128, 0.2); color: var(--success-color); }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--card-bg); padding: 25px; border-radius: 12px; max-width: 400px; width: 100%; border: 1px solid var(--border-color); }
        .hidden { display: none !important; }
        .field-label { font-size: 0.8rem; color: #94a3b8; display: block; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>🏢 የአከፋፋይ ማዕከል</h1>
            <p style="color: #94a3b8; font-size: 0.85rem;">የእቃ ክምችት፣ ትዕዛዞች እና የትርፍ መከታተያ ዳሽቦርድ</p>
        </div>
        <button class="btn-settings" onclick="toggleModal('settingsModal')">⚙️ መቼት</button>
    </header>

    <section class="dashboard">
        <div class="card">
            <h3>ጠቅላላ ካፒታል (በእቃ ላይ ያለ)</h3>
            <p id="distCapital">0.00 ETB</p>
        </div>
        <div class="card" style="border-left-color: var(--success-color);">
            <h3>የዚህ ወር የተጣራ ትርፍ (የደረሱ ትዕዛዞች)</h3>
            <p id="distProfit">0.00 ETB</p>
        </div>
    </section>

    <section class="section-box">
        <h2>📦 አዲስ የጅምላ እቃ መመዝገቢያ</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;">
            <input type="text" id="pName" placeholder="የእቃ ስም">
            <input type="text" id="pModel" placeholder="ሞዴል">
            <input type="number" id="pCost" placeholder="የገዛንበት ዋጋ">
            <input type="number" id="pPrice" placeholder="የመሸጫ ዋጋ">
            <input type="number" id="pQty" placeholder="ብዛት (Stock)">
        </div>
        <button class="btn-add" onclick="registerDistItem()">📥 እቃውን መዝግብ</button>
    </section>

    <section class="section-box">
        <h2>📋 መጋዘን ውስጥ ያሉ እቃዎች</h2>
        <table>
            <thead>
                <tr>
                    <th>የእቃ ስም</th>
                    <th>ሞዴል</th>
                    <th>የገዛንበት</th>
                    <th>የመሸጫ</th>
                    <th>የቀረ ብዛት</th>
                    <th>ድርጊት</th>
                </tr>
            </thead>
            <tbody id="inventoryTableBody">
            </tbody>
        </table>
    </section>

    <section class="section-box">
        <h2>🚚 የደንበኞች ትዕዛዝ መከታተያ</h2>
        <table>
            <thead>
                <tr>
                    <th>የታዘዘው እቃ</th>
                    <th>ብዛት</th>
                    <th>አድራሻ</th>
                    <th>ክፍያ</th>
                    <th>ሁኔታ</th>
                    <th>ድርጊት</th>
                </tr>
            </thead>
            <tbody id="ordersTableBody">
            </tbody>
        </table>
    </section>
</div>

<!-- የአከፋፋይ መግቢያ / ምዝገባ ፎርም -->
<div id="authModal" class="modal">
    <div class="modal-content">
        <h3 style="color: var(--accent-color); margin-bottom: 15px;">🔐 የአከፋፋይ መግቢያ</h3>
        <input type="email" id="authEmail" placeholder="ኢሜይል">
        <input type="password" id="authPassword" placeholder="የይለፍ ቃል (ቢያንስ 6 ፊደል)">

        <label class="field-label">የንግድ ዘርፍ (ለአዲስ ምዝገባ ብቻ ያስፈልጋል)</label>
        <select id="authCategory" onchange="onCategoryChange()">
            <option value="">-- የንግድ ዘርፍ ይምረጡ --</option>
        </select>
        <input type="text" id="authCategoryOther" placeholder="አዲስ የንግድ ዘርፍ ስም ያስገቡ" class="hidden">

        <button class="btn-add" onclick="vendorLogin()">🔓 ግባ</button>
        <button class="btn-add" style="background: var(--success-color); color:#000;" onclick="vendorRegister()">🆕 አዲስ አካውንት ክፈት</button>
        <p id="authError" style="color: var(--danger-color); font-size: 0.85rem; margin-top: 10px;"></p>
    </div>
</div>

<!-- መቼት ሞዳል -->
<div id="settingsModal" class="modal hidden">
    <div class="modal-content">
        <h3 style="color: var(--accent-color); margin-bottom: 15px;">⚙️ መቼቶች</h3>
        <p id="vendorEmailDisplay" style="color: #94a3b8; margin-bottom: 15px;"></p>
        <button class="btn-add" style="background: var(--danger-color); color: #fff;" onclick="vendorLogout()">🚪 ውጣ (Logout)</button>
        <button class="btn-settings" style="width:100%; margin-top:10px;" onclick="toggleModal('settingsModal')">ዝጋ</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://hjsiobhtiwegtwejxamv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_M1g0FcHA9gwSx6IskyacDg_4Oa0VWEV';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let vendorId = null;
    let inventory = [];
    let orders = [];

    function toggleModal(id) {
        document.getElementById(id).classList.toggle('hidden');
    }

    // ---------------- የንግድ ዘርፍ ዝርዝር (ድግግሞሽ እንዳይኖር) ----------------
    async function loadCategories() {
        const { data, error } = await supabase.from('vendor_profiles').select('category');
        const select = document.getElementById('authCategory');
        select.innerHTML = '<option value="">-- የንግድ ዘርፍ ይምረጡ --</option>';
        if (!error && data) {
            const categories = [...new Set(data.map(r => r.category).filter(Boolean))];
            categories.forEach(cat => {
                select.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
        }
        select.innerHTML += '<option value="__other__">➕ ሌላ (Others)</option>';
    }

    function onCategoryChange() {
        const val = document.getElementById('authCategory').value;
        document.getElementById('authCategoryOther').classList.toggle('hidden', val !== '__other__');
    }

    async function saveVendorProfile(id, category) {
        const { data: existing } = await supabase
            .from('vendor_profiles')
            .select('id')
            .eq('id', id)
            .maybeSingle();
        if (!existing) {
            await supabase.from('vendor_profiles').insert([{ id, category }]);
        }
    }

    async function showVendorInfo(email) {
        const { data } = await supabase
            .from('vendor_profiles')
            .select('category')
            .eq('id', vendorId)
            .maybeSingle();
        const cat = data ? data.category : '—';
        document.getElementById('vendorEmailDisplay').innerHTML =
            'ገብተዋል እንደ: ' + email + '<br>የንግድ ዘርፍ: ' + cat;
    }

    // ---------------- Authentication ----------------
    async function checkAuth() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            vendorId = session.user.id;
            await showVendorInfo(session.user.email);
            document.getElementById('authModal').classList.add('hidden');
            await loadAll();
        } else {
            document.getElementById('authModal').classList.remove('hidden');
        }
    }

    async function vendorRegister() {
        const email = document.getElementById('authEmail').value.trim();
        const password = document.getElementById('authPassword').value;
        const errEl = document.getElementById('authError');
        errEl.style.color = 'var(--danger-color)';

        const categorySelect = document.getElementById('authCategory').value;
        const categoryOther = document.getElementById('authCategoryOther').value.trim();
        const category = categorySelect === '__other__' ? categoryOther : categorySelect;

        if (!email || password.length < 6) {
            errEl.innerText = 'ትክክለኛ ኢሜይል እና ቢያንስ 6 ፊደል ያለው የይለፍ ቃል ያስገቡ።';
            return;
        }
        if (!category) {
            errEl.innerText = 'እባክዎ የንግድ ዘርፍዎን ይምረጡ ወይም "ሌላ" መርጠው ያስገቡ!';
            return;
        }

        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) {
            errEl.innerText = error.message;
            return;
        }

        if (data.session) {
            vendorId = data.user.id;
            await saveVendorProfile(vendorId, category);
            await showVendorInfo(data.user.email);
            document.getElementById('authModal').classList.add('hidden');
            await loadAll();
        } else {
            // ኢሜይል ማረጋገጫ የሚያስፈልግ ከሆነ ዘርፉን ለጊዜው እናስቀምጣለን፣ ሲገቡ እናጠናቅቀዋለን
            localStorage.setItem('trf_pending_category_' + email, category);
            errEl.style.color = 'var(--success-color)';
            errEl.innerText = 'ተመዝግበዋል! ኢሜይልዎን በማረጋገጫ ይክፈቱ ከዚያ ይግቡ።';
        }
    }

    async function vendorLogin() {
        const email = document.getElementById('authEmail').value.trim();
        const password = document.getElementById('authPassword').value;
        const errEl = document.getElementById('authError');
        errEl.style.color = 'var(--danger-color)';

        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
            errEl.innerText = 'ስህተት: ትክክለኛ ኢሜይል ወይም የይለፍ ቃል አይደለም።';
            return;
        }

        vendorId = data.user.id;

        const pendingCategory = localStorage.getItem('trf_pending_category_' + email);
        if (pendingCategory) {
            await saveVendorProfile(vendorId, pendingCategory);
            localStorage.removeItem('trf_pending_category_' + email);
        }

        await showVendorInfo(data.user.email);
        document.getElementById('authModal').classList.add('hidden');
        await loadAll();
    }

    async function vendorLogout() {
        await supabase.auth.signOut();
        location.reload();
    }

    async function loadAll() {
        await loadInventory();
        await loadOrders();
    }

    // ---------------- እቃ መመዝገብ / ማምጣት ----------------
    async function registerDistItem() {
        let name = document.getElementById('pName').value.trim();
        let model = document.getElementById('pModel').value.trim();
        let cost = parseFloat(document.getElementById('pCost').value) || 0;
        let price = parseFloat(document.getElementById('pPrice').value) || 0;
        let qty = parseInt(document.getElementById('pQty').value) || 0;

        if (!name || cost <= 0 || qty <= 0) {
            alert('እባክዎ መረጃዎችን በትክክል ይሙሉ!');
            return;
        }

        const { error } = await supabase
            .from('inventory')
            .insert([{ name, model, cost, price, qty, vendor_id: vendorId }]);

        if (error) {
            console.error('ስህተት ተፈጥሯል:', error);
            alert('እቃውን መመዝገብ አልተቻለም። ኢንተርኔትዎን ይፈትሹ!');
            return;
        }

        alert('እቃው በተሳካ ሁኔታ ተመዝግቧል!');
        document.getElementById('pName').value = '';
        document.getElementById('pModel').value = '';
        document.getElementById('pCost').value = '';
        document.getElementById('pPrice').value = '';
        document.getElementById('pQty').value = '';
        await loadInventory();
    }

    async function loadInventory() {
        const { data, error } = await supabase
            .from('inventory')
            .select('*')
            .eq('vendor_id', vendorId)
            .order('id', { ascending: false });

        if (error) { console.error(error); return; }
        inventory = data || [];
        renderInventory();
        computeCapitalAndProfit();
    }

    function renderInventory() {
        let tbody = document.getElementById('inventoryTableBody');
        tbody.innerHTML = '';

        if (inventory.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">ምንም እቃ አልተመዘገበም</td></tr>';
            return;
        }

        inventory.forEach(item => {
            tbody.innerHTML += `
                <tr>
                    <td>${item.name}</td>
                    <td>${item.model || '-'}</td>
                    <td>${Number(item.cost).toLocaleString()} ብር</td>
                    <td>${Number(item.price).toLocaleString()} ብር</td>
                    <td><strong>${item.qty}</strong></td>
                    <td><button onclick="deleteItem(${item.id})" style="background:var(--danger-color); color:#fff; padding:5px 10px;">ሰርዝ</button></td>
                </tr>`;
        });
    }

    async function deleteItem(id) {
        if (!confirm('እርግጠኛ ነዎት ይህን እቃ መሰረዝ ይፈልጋሉ?')) return;

        const { error } = await supabase
            .from('inventory')
            .delete()
            .eq('id', id)
            .eq('vendor_id', vendorId);

        if (error) {
            console.error(error);
            alert('መሰረዝ አልተቻለም!');
            return;
        }
        await loadInventory();
    }

    // ---------------- ትዕዛዞችን ማምጣት / ማዘመን ----------------
    async function loadOrders() {
        const { data, error } = await supabase
            .from('orders')
            .select('*')
            .eq('vendor_id', vendorId)
            .order('id', { ascending: false });

        if (error) { console.error(error); return; }
        orders = data || [];
        renderOrders();
        computeCapitalAndProfit();
    }

    function renderOrders() {
        let tbody = document.getElementById('ordersTableBody');
        tbody.innerHTML = '';

        if (orders.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">እስካሁን የመጣ ትዕዛዝ የለም</td></tr>';
            return;
        }

        orders.forEach(order => {
            let statusBadge = '';
            let actionBtn = '';

            if (order.status === 'pending') {
                statusBadge = '<span class="badge status-pending">ይጠብቃል (Pending)</span>';
                actionBtn = `<button class="btn-action" onclick="updateOrderStatus(${order.id}, 'shipped')">ወደ ማድረሻ ላክ</button>`;
            } else if (order.status === 'shipped') {
                statusBadge = '<span class="badge status-shipped">በመንገድ ላይ (Shipped)</span>';
                actionBtn = `<button class="btn-action" style="background:var(--success-color);" onclick="updateOrderStatus(${order.id}, 'delivered')">ደርሷል በል</button>`;
            } else {
                statusBadge = '<span class="badge status-delivered">ደርሷል (Delivered)</span>';
                actionBtn = '<span style="color:#94a3b8; font-size:0.8rem;">ተጠናቋል</span>';
            }

            tbody.innerHTML += `
                <tr>
                    <td>${order.item}</td>
                    <td>${order.qty}</td>
                    <td>${order.address}</td>
                    <td>${order.payment}</td>
                    <td>${statusBadge}</td>
                    <td>${actionBtn}</td>
                </tr>`;
        });
    }

    async function updateOrderStatus(id, newStatus) {
        const { error } = await supabase
            .from('orders')
            .update({ status: newStatus })
            .eq('id', id)
            .eq('vendor_id', vendorId);

        if (error) {
            console.error(error);
            alert('ማዘመን አልተቻለም!');
            return;
        }
        await loadOrders();
    }

    // ---------------- ካፒታል እና ትርፍ ማስላት ----------------
    function computeCapitalAndProfit() {
        let totalCapital = inventory.reduce((sum, i) => sum + (i.cost * i.qty), 0);
        document.getElementById('distCapital').innerText = totalCapital.toLocaleString() + ' ETB';

        const costById = {};
        inventory.forEach(i => costById[i.id] = i.cost);

        const now = new Date();
        const thisMonth = now.getMonth();
        const thisYear = now.getFullYear();

        let profit = 0;
        orders.forEach(o => {
            if (o.status !== 'delivered') return;
            const d = new Date(o.created_at);
            if (d.getMonth() !== thisMonth || d.getFullYear() !== thisYear) return;
            const cost = costById[o.item_id];
            if (cost === undefined) return;
            profit += (o.price - cost) * o.qty;
        });
        document.getElementById('distProfit').innerText = profit.toLocaleString() + ' ETB';
    }

    // ---------------- ገፅ ሲከፈት ----------------
    window.onload = () => {
        loadCategories();
        checkAuth();
    };
</script>
