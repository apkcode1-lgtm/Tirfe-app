<!DOCTYPE html>
<html lang="am" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, minimum-scale=0.5, maximum-scale=3.0">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <title>ትርፌ - ዘመናዊ መቆጣጠሪያ</title>
    
    <style>
        /* ==========================================================================
           1. 2026 MINIMALIST MONOCHROME THEME (ጥቁር እና ነጭ ብቻ)
           ========================================================================== */
        :root {
            --bg-color: #ffffff;
            --text-primary: #000000;
            --text-secondary: #666666;
            --border-color: #e5e5e5;
            --input-bg: #f8f8f8;
            --nav-bg: rgba(255, 255, 255, 0.85);
            --invert-btn: #000000;
            --invert-btn-text: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #000000;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: #222222;
            --input-bg: #111111;
            --nav-bg: rgba(0, 0, 0, 0.85);
            --invert-btn: #ffffff;
            --invert-btn-text: #000000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: var(--bg-color); color: var(--text-primary);
            padding-bottom: 90px; /* For bottom nav */
            transition: background-color 0.4s ease, color 0.4s ease;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .hidden { display: none !important; }

        /* ==========================================================================
           2. TYPOGRAPHY & HEADER (ያለ ሳጥን በጽሁፍ ብቻ የሚያምር)
           ========================================================================== */
        .page-header { margin-bottom: 40px; text-align: left; padding-top: 20px; }
        .page-header h1 { font-size: 2rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 5px; }
        .page-header p { color: var(--text-secondary); font-size: 1rem; }

        /* ==========================================================================
           3. HOME DASHBOARD (BIG NUMBERS, NO BOXES)
           ========================================================================== */
        .stats-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px 20px; margin-bottom: 40px;
        }
        .stat-item {
            display: flex; flex-direction: column; gap: 5px;
        }
        .stat-value {
            font-size: 2.8rem; font-weight: 800; letter-spacing: -2px; line-height: 1;
        }
        .stat-label {
            font-size: 0.85rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
        }

        /* ==========================================================================
           4. LIST MENUS & BUTTONS (iOS / Linear App Style)
           ========================================================================== */
        .menu-list {
            display: flex; flex-direction: column; gap: 0;
            border-top: 1px solid var(--border-color);
        }
        .menu-btn {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; padding: 20px 0; border: none; background: none;
            color: var(--text-primary); font-size: 1.1rem; font-weight: 500;
            border-bottom: 1px solid var(--border-color); cursor: pointer;
            text-align: left; transition: opacity 0.2s;
        }
        .menu-btn:hover { opacity: 0.6; }
        .menu-btn::after { content: "→"; color: var(--text-secondary); font-size: 1.2rem; }

        /* Action Buttons (Solid Monochrome) */
        .btn-solid {
            background-color: var(--invert-btn); color: var(--invert-btn-text);
            border: none; padding: 16px 24px; border-radius: 12px;
            font-size: 1rem; font-weight: 600; width: 100%; cursor: pointer;
            transition: transform 0.2s ease;
        }
        .btn-solid:active { transform: scale(0.97); }

        /* ==========================================================================
           5. FORMS & INPUTS (Minimalist)
           ========================================================================== */
        .input-group { margin-bottom: 25px; }
        .input-group label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 8px; font-weight: 500; }
        input, select {
            width: 100%; padding: 16px; background-color: var(--input-bg);
            border: 1px solid transparent; border-radius: 12px;
            color: var(--text-primary); font-size: 1rem; outline: none; transition: all 0.2s;
        }
        input:focus { border-color: var(--text-primary); }

        /* ==========================================================================
           6. BOTTOM NAVIGATION (Glassmorphic Minimal)
           ========================================================================== */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--nav-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; align-items: center;
            padding: 15px 0 calc(15px + env(safe-area-inset-bottom)) 0; z-index: 9000;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            color: var(--text-secondary); border: none; background: none;
            font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: color 0.3s ease;
        }
        .nav-item.active { color: var(--text-primary); }
        .nav-item svg { width: 24px; height: 24px; stroke-width: 2; stroke: currentColor; fill: none; }

        /* ==========================================================================
           7. TABLES (Clean & Borderless Look)
           ========================================================================== */
        table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 20px; }
        th { color: var(--text-secondary); font-size: 0.8rem; text-transform: uppercase; padding: 15px 0; border-bottom: 1px solid var(--border-color); font-weight: 600; }
        td { padding: 15px 0; border-bottom: 1px solid var(--border-color); font-size: 0.95rem; }

    </style>
</head>
<body>

<div class="container">
    
    <header class="page-header">
        <h1>መቆጣጠሪያ</h1>
        <p id="dateDisplay">የስራ ማዕከል</p>
    </header>

    <!-- ==============================================================
         TAB 1: HOME (ዳሽቦርድ - ቁጥሮች ብቻ)
         ============================================================== -->
    <section id="tab-home" class="tab-view">
        <div class="stats-grid">
            <div class="stat-item">
                <span class="stat-value" id="adminTotalTenants">0</span>
                <span class="stat-label">ጠቅላላ ተከራዮች</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="adminActiveTenants">0</span>
                <span class="stat-label">ንቁ ተከራዮች</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="adminTotalFees">0.00</span>
                <span class="stat-label">የተሰበሰበ (ETB)</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="adminTotalBuyers">0</span>
                <span class="stat-label">ገዥዎች (Buyers)</span>
            </div>
        </div>

        <!-- Alerts Section Preserved -->
        <div id="adminExpiryAlerts"></div>
    </section>

    <!-- ==============================================================
         TAB 2: MENU/ACTIONS (ተግባራት - ዝርዝር ብቻ)
         ============================================================== -->
    <section id="tab-menu" class="tab-view hidden">
        <h2 style="font-size: 1.2rem; margin-bottom: 20px;">ዋና ዋና ተግባራት</h2>
        <div class="menu-list">
            <button class="menu-btn" onclick="toggleTenantListView()">ተከራዮችን ዝርዝር እይ</button>
            <button class="menu-btn" onclick="openTariffSettings()">የታሪፍ ማስተካከያ</button>
            <button class="menu-btn" onclick="openVATSettings()">የቫት (VAT) መቼት</button>
            <button class="menu-btn" onclick="openRevenueRegistrationModal()">ገቢወች ምዝገባ</button>
            <button class="menu-btn" onclick="toggleAdminRevenueView()">ገቢዎች ዝርዝር</button>
            <button class="menu-btn" onclick="openBizTypeManager()">የንግድ ዘርፎች</button>
            <button class="menu-btn" onclick="if(typeof toggleAdminMotorsView === 'function') toggleAdminMotorsView()">የሞተረኛ ዝርዝር</button>
            <button class="menu-btn" onclick="if(typeof openMotorTariffSettings === 'function') openMotorTariffSettings()">የሞተረኛ ታሪፍ</button>
        </div>

        <!-- Hidden List Sections (These will appear when functions trigger them) -->
        <div id="adminTenantsSection" class="hidden" style="margin-top: 30px;">
            <h2 style="font-size:1.2rem;">የተከራዮች ዝርዝር</h2>
            <input type="text" id="adminSearchInput" placeholder="ተከራይ ፈልግ..." oninput="renderAdminPanel()" style="margin-top:15px;">
            <div style="overflow-x: auto;">
                <table>
                    <thead><tr><th>ስም</th><th>ፕሮፋይል</th><th>ክፍያ</th><th>እርምጃ</th></tr></thead>
                    <tbody id="tenantTableBody"></tbody>
                </table>
            </div>
        </div>
        
        <div id="adminBuyersSection" class="hidden" style="margin-top: 30px;">
            <h2 style="font-size:1.2rem;">የገዥዎች ዝርዝር</h2>
            <table>
                <thead><tr><th>ገዥ</th><th>ስልክ</th><th>እርምጃ</th></tr></thead>
                <tbody id="adminBuyersTableBody"></tbody>
            </table>
        </div>
    </section>

    <!-- ==============================================================
         TAB 3: SETTINGS (መቼቶች - ቴሌግራም፣ ባንክ እና ሌሎች)
         ============================================================== -->
    <section id="tab-settings" class="tab-view hidden">
        <h2 style="font-size: 1.2rem; margin-bottom: 20px;">የሲስተም መረጃዎች</h2>
        
        <div class="input-group">
            <label>ቴሌግራም ቦት ቶከን (Bot Token)</label>
            <input type="password" id="adminTgToken" placeholder="ቶከን ያስገቡ">
        </div>
        
        <div class="input-group">
            <label>የቴሌግራም ቻት አይዲ (Chat ID)</label>
            <input type="text" id="adminTgChatId" placeholder="ቻት አይዲ">
        </div>
        
        <div class="input-group">
            <label>የባንክ መረጃ / ሂሳብ ቁጥር</label>
            <input type="text" id="adminBankInfo" placeholder="የባንክ አካውንት">
        </div>

        <button class="btn-solid" style="margin-top: 10px;" onclick="saveAdminSystemSettings()">መረጃውን አስቀምጥ</button>

        <div style="margin-top: 50px; border-top: 1px solid var(--border-color); padding-top: 20px;">
            <button class="menu-btn" style="color: #ff3b30; justify-content: center; border: none;" onclick="forceLogout()">ከሲስተሙ ውጣ (Log Out)</button>
        </div>
    </section>

</div>

<!-- =======================================================================
     BOTTOM NAVIGATION BAR (በ 4 የተከፈለ)
     ======================================================================= -->
<nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('tab-home', this)">
        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        <span>ዳሽቦርድ</span>
    </button>
    
    <button class="nav-item" onclick="switchTab('tab-menu', this)">
        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        <span>ማውጫ</span>
    </button>
    
    <button class="nav-item" onclick="switchTab('tab-settings', this)">
        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
        <span>መቼት</span>
    </button>
    
    <!-- THEME TOGGLE (የገጽታ መቀየሪያ የብቻው ናቪጌሽን ሆኗል) -->
    <button class="nav-item" onclick="toggleTheme()">
        <svg id="themeIcon" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        <span id="themeText">ነጭ አድርግ</span>
    </button>
</nav>

<!-- Modals & Scripts Preserved -->
<script defer src="js/common/firebase-config.js"></script>
<script defer src="js/common/database.js"></script>
<script defer src="js/common/utils.js"></script>
<script defer src="js/common/globals.js"></script>
<script defer src="js/common/session_security.js"></script>
<script defer src="js/common/ui_helpers.js"></script>
<script defer src="js/common/business_logic.js"></script>
<script defer src="js/common/auth_part1.js"></script>
<script defer src="js/common/auth_part2.js"></script>
<script defer src="/api/router?file=admin.js"></script>

<script>
    // Tab Switching Logic
    function switchTab(tabId, navElement) {
        document.querySelectorAll('.tab-view').forEach(el => el.classList.add('hidden'));
        document.getElementById(tabId).classList.remove('hidden');
        
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        navElement.classList.add('active');
    }

    // Theme Toggle Logic (Black & White Only)
    function toggleTheme() {
        const body = document.documentElement;
        const themeText = document.getElementById('themeText');
        const isDark = body.getAttribute('data-theme') === 'dark';

        if (isDark) {
            body.setAttribute('data-theme', 'light');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff');
            themeText.innerText = "ጥቁር አድርግ";
        } else {
            body.setAttribute('data-theme', 'dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#000000');
            themeText.innerText = "ነጭ አድርግ";
        }
    }

    // ቀን ማሳያ
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('dateDisplay').innerText = new Date().toLocaleDateString('am-ET', options);
</script>

</body>
</html>
